# Optional: fully-automated redeploys of the daily-briefing worker.
#
# One-time setup (then it runs itself):
#   1. Create a scoped Cloudflare API token (Workers Scripts: Edit) at
#      https://dash.cloudflare.com/profile/api-tokens
#   2. In this repo: Settings → Secrets and variables → Actions → add:
#        CLOUDFLARE_API_TOKEN   = <the token>
#        ANTHROPIC_API_KEY      = <your Anthropic key>
#   3. (First time only) wire the worker URL into index.html — easiest via the
#      local `npm run deploy:briefing`, which also sets it up. After that, this
#      workflow keeps the worker code deployed automatically.
#
# It does NOT run unless those secrets exist, so it's a no-op until you opt in.

name: Deploy briefing worker

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-briefing-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not configured
        id: gate
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare/Anthropic secrets not set — skipping (this is expected until you opt in)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 20

      - name: Set secret + deploy
        if: steps.gate.outputs.configured == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx --yes wrangler secret put ANTHROPIC_API_KEY
          npx --yes wrangler deploy
