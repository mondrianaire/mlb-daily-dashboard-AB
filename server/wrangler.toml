# Cloudflare Worker config for the daily-briefing rephrasing proxy.
# Deploy: see server/README.md.  (This file holds NO secrets.)

name = "mlb-briefing-proxy"
main = "briefing-worker.js"
compatibility_date = "2026-05-01"

# Optional model + CORS overrides (safe to commit; not secrets).
[vars]
MODEL = "claude-3-5-haiku-latest"
# Restrict this to your site origin in production, e.g.
# ALLOWED_ORIGIN = "https://mondrianaire.github.io"
ALLOWED_ORIGIN = "*"

# Optional: cache the daily rephrasing so it costs ~1 model call/day total
# (the briefing is identical for every visitor on a given day). To enable,
# create a KV namespace and uncomment:
#   wrangler kv namespace create BRIEFING_CACHE
# then paste the returned id below.
# [[kv_namespaces]]
# binding = "BRIEFING_CACHE"
# id = "<your-kv-namespace-id>"
